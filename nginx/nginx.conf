events {
    worker_connections 1024;
}

http {
    # Upstream configuration for application nodes.
    # No strategy directive → Nginx uses round-robin by default: each new
    # connection goes to the next node in sequence (node-1, node-2, node-3,
    # node-1, node-2, ...). Predictable and evenly distributed, which is
    # exactly what we want for a demo of multi-node coordination.
    upstream app_nodes {
        server node-1:3001;
        server node-2:3002;
        server node-3:3003;
    }

    # WebSocket and HTTP server
    server {
        listen 80;
        server_name localhost;

        # WebSocket endpoint
        location /ws {
            proxy_pass http://app_nodes;
            
            # WebSocket upgrade headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts for long-lived connections
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # HTTP API endpoints
        location / {
            proxy_pass http://app_nodes;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Standard timeouts for HTTP requests
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
